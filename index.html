<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Messages</title>

<style>

/* 메시지 기본 */

.message{
    display:flex;
    margin-bottom:8px;
    width:100%;
}


.message.me{
    justify-content:flex-end;
}


.message.other{
    justify-content:flex-start;
}



/* 상대방 회색 말풍선 */

.bubble.other{

    max-width:75%;

    background:#e9e9eb;

    color:#000;

    padding:9px 14px;

    border-radius:20px;

    font-size:17px;

    line-height:1.35;

    word-break:break-word;

}



/* 내 파란색 말풍선 */

.bubble.me{

    max-width:75%;

    background:#007aff;

    color:white;

    padding:9px 14px;

    border-radius:20px;

    font-size:17px;

    line-height:1.35;

    word-break:break-word;

}



/* 말풍선 꼬리 느낌 */

.other .bubble{

    border-bottom-left-radius:5px;

}


.me .bubble{

    border-bottom-right-radius:5px;

}



/* 시간 표시 */

.time{

    font-size:11px;

    color:#8e8e93;

    align-self:flex-end;

    margin:0 5px;

}



/* 읽음 표시 */

.read{

    font-size:12px;

    color:#8e8e93;

    text-align:right;

    margin-top:2px;

}



/* 날짜 구분 */

.date{

    text-align:center;

    font-size:12px;

    color:#8e8e93;

    margin:15px 0;

}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
    background:#fff;
}


/* 전체 앱 영역 */

.app{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    background:#fff;
}


/* 메시지 상단 */

.header{

    height:88px;

    padding-top:env(safe-area-inset-top);

    display:flex;
    align-items:flex-end;

    padding-left:16px;
    padding-right:16px;
    padding-bottom:10px;

    border-bottom:1px solid #ddd;

    background:
    rgba(255,255,255,0.9);

    backdrop-filter:blur(20px);

}


.back{

    font-size:32px;
    width:40px;
    color:#007aff;

}


.profile{

    flex:1;
    text-align:center;

}


.name{

    font-size:17px;
    font-weight:600;

}


.sub{

    font-size:12px;
    color:#777;

}


.info{

    width:40px;
    text-align:right;
    font-size:24px;
    color:#007aff;

}



/* 메시지 영역 */

.messages{

    flex:1;

    overflow-y:auto;

    padding:15px;

    background:#fff;

}



/* 하단 입력창 */

.input-area{

    height:60px;

    padding-bottom:env(safe-area-inset-bottom);

    display:flex;

    align-items:center;

    padding-left:12px;
    padding-right:12px;

    border-top:1px solid #ddd;

    background:
    rgba(250,250,250,0.9);

    backdrop-filter:blur(20px);

}


.input-box{

    flex:1;

    height:38px;

    border-radius:20px;

    border:1px solid #ccc;

    padding-left:15px;

    font-size:16px;

}


.plus{

    width:35px;

    font-size:28px;

    color:#777;

}


.voice{

    width:35px;

    font-size:25px;

    color:#007aff;

}

/* 메시지 등장 애니메이션 */

.message{

    animation:
    messageIn .18s ease-out;

}


@keyframes messageIn{

    from{

        opacity:0;

        transform:
        translateY(10px);

    }


    to{

        opacity:1;

        transform:
        translateY(0);

    }

}



/* 입력창 iOS 느낌 개선 */

.input-box{

    background:#fff;

    outline:none;

}


.input-box:focus{

    border-color:#007aff;

}



/* 스크롤바 제거 */

.messages::-webkit-scrollbar{

    display:none;

}



/* 하단 영역 고정 느낌 */

.input-area{

    flex-shrink:0;

}



/* 버튼 터치 효과 */

.plus,
.voice,
.back,
.info{

    user-select:none;

}


.plus:active,
.voice:active,
.back:active,
.info:active{

    opacity:.5;

}

</style>

</head>


<body>


<div class="app">


    <div class="header">


        <div class="back">
            ‹
        </div>


        <div class="profile">

            <div class="name">
                홍길동
            </div>

            <div class="sub">
                iMessage
            </div>

        </div>


        <div class="info">
            ⓘ
        </div>


    </div>



    <div class="messages">
        <div class="date">
오늘 오후 1:35
</div>


<div class="message other">

    <div class="bubble other">
        안녕하세요
    </div>

    <div class="time">
        1:35
    </div>

</div>



<div class="message me">

    <div class="time">
        1:36
    </div>

    <div>

        <div class="bubble me">
            네 안녕하세요
        </div>

        <div class="read">
            읽음
        </div>

    </div>

</div>

    </div>



    <div class="input-area">

        <div class="plus">
            ＋
        </div>


        <input 
        class="input-box"
        placeholder="iMessage">


        <div class="voice">
            🎙
        </div>


    </div>


</div>
<script>

const input = document.querySelector(".input-box");
const messages = document.querySelector(".messages");


// 메시지 추가 함수

function addMessage(text){

    if(!text.trim()) return;


    const wrap = document.createElement("div");

    wrap.className = "message me";


    wrap.innerHTML = `

        <div class="time">
            ${getTime()}
        </div>


        <div>

            <div class="bubble me">
                ${text}
            </div>

            <div class="read">
                읽음
            </div>

        </div>

    `;


    messages.appendChild(wrap);


    scrollBottom();

}



// 현재 시간

function getTime(){

    const now = new Date();

    let h = now.getHours();

    let m = now.getMinutes();


    return h + ":" + 
    (m < 10 ? "0"+m : m);

}



// 자동 스크롤

function scrollBottom(){

    messages.scrollTop =
    messages.scrollHeight;

}



// 엔터 전송

input.addEventListener(
"keydown",
function(e){


    if(e.key==="Enter"){

        addMessage(input.value);

        input.value="";

    }


});

</script>

</body>
</html>
