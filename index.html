<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Messages</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
    background:#fff;
}


/* 전체 앱 영역 */

.app{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    background:#fff;
}


/* 메시지 상단 */

.header{

    height:88px;

    padding-top:env(safe-area-inset-top);

    display:flex;
    align-items:flex-end;

    padding-left:16px;
    padding-right:16px;
    padding-bottom:10px;

    border-bottom:1px solid #ddd;

    background:
    rgba(255,255,255,0.9);

    backdrop-filter:blur(20px);

}


.back{

    font-size:32px;
    width:40px;
    color:#007aff;

}


.profile{

    flex:1;
    text-align:center;

}


.name{

    font-size:17px;
    font-weight:600;

}


.sub{

    font-size:12px;
    color:#777;

}


.info{

    width:40px;
    text-align:right;
    font-size:24px;
    color:#007aff;

}



/* 메시지 영역 */

.messages{

    flex:1;

    overflow-y:auto;

    padding:15px;

    background:#fff;

}



/* 하단 입력창 */

.input-area{

    height:60px;

    padding-bottom:env(safe-area-inset-bottom);

    display:flex;

    align-items:center;

    padding-left:12px;
    padding-right:12px;

    border-top:1px solid #ddd;

    background:
    rgba(250,250,250,0.9);

    backdrop-filter:blur(20px);

}


.input-box{

    flex:1;

    height:38px;

    border-radius:20px;

    border:1px solid #ccc;

    padding-left:15px;

    font-size:16px;

}


.plus{

    width:35px;

    font-size:28px;

    color:#777;

}


.voice{

    width:35px;

    font-size:25px;

    color:#007aff;

}


</style>

</head>


<body>


<div class="app">


    <div class="header">


        <div class="back">
            ‹
        </div>


        <div class="profile">

            <div class="name">
                홍길동
            </div>

            <div class="sub">
                iMessage
            </div>

        </div>


        <div class="info">
            ⓘ
        </div>


    </div>



    <div class="messages">

    </div>



    <div class="input-area">

        <div class="plus">
            ＋
        </div>


        <input 
        class="input-box"
        placeholder="iMessage">


        <div class="voice">
            🎙
        </div>


    </div>


</div>


</body>
</html>
